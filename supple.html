<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サプリ管理</title>
<style>
  body {
    font-family: sans-serif;
    padding: 20px;
    background-color: #fafafa;
    color: #333;
  }
  .container {
    max-width: 400px;
    margin: 0 auto;
  }
  .group {
    margin-bottom: 40px;
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }
  h2 {
    margin: 0 0 10px 0;
    font-size: 16px;
    color: #666;
  }
  button {
    width: 100%;
    padding: 20px;
    font-size: 18px;
    font-weight: bold;
    color: #fff;
    background-color: #007bff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 15px;
    -webkit-tap-highlight-color: transparent;
  }
  button:active {
    opacity: 0.8;
    transform: scale(0.98);
  }
  /* 亜鉛ボタンの色を変える場合 */
  #btn-zinc {
    background-color: #28a745;
  }
  .log-list {
    font-size: 16px;
    line-height: 1.8;
  }
  .log-item {
    border-bottom: 1px solid #eee;
    padding: 5px 0;
  }
  .log-item:last-child {
    border-bottom: none;
    color: #999; /* 2回前は薄く表示 */
  }
  .label {
    display: inline-block;
    width: 50px;
    font-weight: bold;
    font-size: 12px;
    color: #888;
  }
</style>
</head>
<body>

<div class="container">
  <div class="group">
    <button onclick="addLog('vitD')">ビタミンD を飲む</button>
    <div id="list-vitD" class="log-list"></div>
  </div>

  <div class="group">
    <button id="btn-zinc" onclick="addLog('zinc')">亜鉛 を飲む</button>
    <div id="list-zinc" class="log-list"></div>
  </div>
</div>

<script>
  // 保存用のキー設定
  const KEYS = {
    vitD: 'history_vitD_v1',
    zinc: 'history_zinc_v1'
  };

  // 画面読み込み時に履歴を表示
  render('vitD');
  render('zinc');

  // 記録機能
  function addLog(type) {
    // 現在の履歴を取得（なければ空のリスト）
    let list = JSON.parse(localStorage.getItem(KEYS[type]) || '[]');
    
    // 現在時刻をフォーマット (例: 12/31 14:00)
    const now = new Date();
    const timeStr = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    
    // 先頭に追加
    list.unshift(timeStr);
    
    // 2件を超えたら末尾（古いもの）を削除
    if (list.length > 2) {
      list.pop();
    }
    
    // 保存して再描画
    localStorage.setItem(KEYS[type], JSON.stringify(list));
    render(type);
  }

  // 表示機能
  function render(type) {
    const list = JSON.parse(localStorage.getItem(KEYS[type]) || '[]');
    const container = document.getElementById(`list-${type}`);
    
    // HTMLを生成
    let html = '';
    list.forEach((time, index) => {
      const label = index === 0 ? '今回' : '前回';
      html += `<div class="log-item"><span class="label">${label}</span> ${time}</div>`;
    });
    
    // 表示がない場合のメッセージ
    if (list.length === 0) {
      html = '<div class="log-item" style="color:#ccc">履歴なし</div>';
    }
    
    container.innerHTML = html;
  }
</script>

</body>
</html>
