<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f4f4f5">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💊</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23ffffff%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-size=%2270%22>💊</text></svg>">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="サプリ管理">

<title>サプリ記録</title>
<style>
  :root {
    --bg-grad-1: #eef2ff;
    --bg-grad-2: #e0e7ff;

    --glass-bg: rgba(255, 255, 255, 0.6);
    --glass-border: rgba(255, 255, 255, 0.85);
    --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.08);

    --text-main: #1e293b;
    --text-sub: #64748b;
    --accent-blue: #3b82f6;
    --accent-green: #10b981;
    --ripple: rgba(255, 255, 255, 0.45);

    --toast-bg: rgba(15, 23, 42, 0.88);
    --toast-text: #fff;

    --vitd-gradient: linear-gradient(135deg, #f59e0b, #f97316);
    --vitd-glow: rgba(245, 158, 11, 0.25);
    --vitd-light: rgba(245, 158, 11, 0.08);

    --zinc-gradient: linear-gradient(135deg, #06b6d4, #3b82f6);
    --zinc-glow: rgba(6, 182, 212, 0.25);
    --zinc-light: rgba(6, 182, 212, 0.08);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-grad-1: #0f172a;
      --bg-grad-2: #020617;

      --glass-bg: rgba(30, 41, 59, 0.6);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);

      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --accent-blue: #60a5fa;
      --accent-green: #34d399;

      --vitd-light: rgba(245, 158, 11, 0.12);
      --zinc-light: rgba(6, 182, 212, 0.12);
    }
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
    margin: 0;
    padding: 24px 16px;
    padding-top: calc(env(safe-area-inset-top, 20px) + 12px);
    background: linear-gradient(160deg, var(--bg-grad-1), var(--bg-grad-2));
    min-height: 100vh;
    color: var(--text-main);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    line-height: 1.5;
  }

  .container {
    max-width: 420px;
    margin: 0 auto;
    padding-bottom: 100px;
  }

  /* --- Header --- */
  .header {
    text-align: center;
    margin-bottom: 32px;
    animation: fadeDown 0.6s ease-out;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 800;
    margin: 0;
    letter-spacing: -0.5px;
  }
  .header p {
    font-size: 13px;
    color: var(--text-sub);
    margin: 4px 0 0;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* --- Card --- */
  .card {
    background: var(--glass-bg);
    box-shadow: var(--glass-shadow);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 20px;
    margin-bottom: 20px;
    animation: cardIn 0.5s ease-out both;
  }
  .card:nth-child(2) { animation-delay: 0.1s; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Card accent stripe */
  .card-vitD { border-left: 4px solid #f59e0b; }
  .card-zinc { border-left: 4px solid #06b6d4; }

  /* --- Supplement label --- */
  .suppl-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .suppl-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }
  .suppl-icon-vitD { background: var(--vitd-light); }
  .suppl-icon-zinc { background: var(--zinc-light); }
  .suppl-name {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  /* --- Record Button --- */
  .record-btn-wrapper {
    height: 56px;
    margin-bottom: 16px;
    display: flex;
    justify-content: center;
  }

  button.record-btn {
    position: relative;
    overflow: hidden;
    width: 100%;
    height: 100%;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    letter-spacing: 0.3px;
  }

  button.record-btn:active { transform: scale(0.96); }

  button.record-btn.success {
    width: 56px;
    border-radius: 50%;
    background-color: var(--accent-green) !important;
  }

  .btn-text {
    transition: opacity 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn-icon {
    position: absolute;
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.3s;
    font-size: 24px;
  }

  button.record-btn.success .btn-text { opacity: 0; }
  button.record-btn.success .btn-icon { opacity: 1; transform: scale(1); }

  .btn-vitD {
    background: var(--vitd-gradient);
    box-shadow: 0 4px 16px var(--vitd-glow);
  }
  .btn-zinc {
    background: var(--zinc-gradient);
    box-shadow: 0 4px 16px var(--zinc-glow);
  }

  /* --- Ripple --- */
  span.ripple {
    position: absolute;
    border-radius: 50%;
    transform: scale(0);
    animation: ripple 0.6s linear;
    background-color: var(--ripple);
    pointer-events: none;
  }
  @keyframes ripple {
    to { transform: scale(4); opacity: 0; }
  }

  /* --- Log list --- */
  .log-list { min-height: 20px; }

  .log-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid rgba(150, 150, 150, 0.12);
    animation: slideIn 0.35s ease-out;
  }
  .log-item:last-child { border-bottom: none; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-8px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-sub);
    background: rgba(150, 150, 150, 0.1);
    padding: 3px 10px;
    border-radius: 20px;
  }

  .time-col { text-align: right; }
  .time {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", monospace;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.5px;
  }
  .diff {
    font-size: 11px;
    color: var(--text-sub);
    margin-top: 2px;
    display: block;
  }

  .edit-btn {
    background: none;
    border: none;
    color: var(--text-sub);
    padding: 8px;
    font-size: 15px;
    cursor: pointer;
    opacity: 0.4;
    transition: opacity 0.2s;
    border-radius: 8px;
  }
  .edit-btn:active { opacity: 1; background: rgba(150,150,150,0.1); }

  .empty-state {
    text-align: center;
    color: var(--text-sub);
    padding: 8px;
    font-size: 13px;
    opacity: 0.7;
  }

  /* --- Toast --- */
  #toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translate(-50%, 150%);
    background: var(--toast-bg);
    color: var(--toast-text);
    padding: 12px 20px;
    border-radius: 50px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 100;
    font-size: 14px;
    font-weight: 500;
    backdrop-filter: blur(12px);
  }
  #toast.show { transform: translate(-50%, 0); }

  #undo-btn {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  #undo-btn:active { background: rgba(255,255,255,0.3); }

  /* --- Modal --- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 200;
  }
  .modal-overlay.open {
    display: flex;
    animation: fadeIn 0.25s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal {
    background: rgba(255, 255, 255, 0.92);
    border-radius: 24px;
    padding: 28px 24px;
    width: 85%;
    max-width: 320px;
    box-shadow: 0 24px 48px rgba(0,0,0,0.2);
    text-align: center;
    color: #1e293b;
    animation: modalIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.9) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  @media (prefers-color-scheme: dark) {
    .modal { background: rgba(30, 41, 59, 0.95); color: #f1f5f9; }
  }

  .modal h3 {
    margin: 0 0 8px;
    font-size: 17px;
    font-weight: 700;
  }
  .modal .modal-subtitle {
    font-size: 13px;
    color: var(--text-sub);
    margin-bottom: 20px;
  }

  .time-input-wrapper {
    margin-bottom: 20px;
  }
  .time-input-wrapper input[type="time"] {
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 32px;
    font-weight: 600;
    text-align: center;
    width: 100%;
    padding: 12px;
    border: 2px solid rgba(150,150,150,0.2);
    border-radius: 16px;
    background: rgba(150,150,150,0.06);
    color: var(--text-main);
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  .time-input-wrapper input[type="time"]:focus {
    border-color: var(--accent-blue);
  }

  .modal-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .m-btn {
    padding: 14px;
    border-radius: 14px;
    border: none;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: transform 0.15s, background 0.2s;
    background: rgba(150,150,150,0.1);
    color: var(--text-main);
  }
  .m-btn:active { transform: scale(0.97); }
  .m-btn.primary {
    background: var(--accent-blue);
    color: white;
  }
  .m-btn.primary:active { background: #2563eb; }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>💊 サプリ記録</h1>
    <p id="today-date"></p>
  </div>

  <div class="card card-vitD">
    <div class="suppl-header">
      <div class="suppl-icon suppl-icon-vitD">☀️</div>
      <span class="suppl-name">ビタミンD</span>
    </div>
    <div class="record-btn-wrapper">
      <button type="button" class="record-btn btn-vitD" onclick="handleRecord(this, 'vitD')">
        <span class="btn-text">記録する</span>
        <span class="btn-icon">✔</span>
      </button>
    </div>
    <div id="display-vitD" class="log-list"></div>
  </div>

  <div class="card card-zinc">
    <div class="suppl-header">
      <div class="suppl-icon suppl-icon-zinc">🧬</div>
      <span class="suppl-name">亜鉛</span>
    </div>
    <div class="record-btn-wrapper">
      <button type="button" class="record-btn btn-zinc" onclick="handleRecord(this, 'zinc')">
        <span class="btn-text">記録する</span>
        <span class="btn-icon">✔</span>
      </button>
    </div>
    <div id="display-zinc" class="log-list"></div>
  </div>

</div>

<div id="toast">
  <span>記録しました</span>
  <button id="undo-btn" onclick="undo()">取り消す</button>
</div>

<div id="edit-modal" class="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3>時間を修正</h3>
    <p class="modal-subtitle" id="edit-label"></p>
    <div class="time-input-wrapper">
      <input type="time" id="time-picker">
    </div>
    <div class="modal-actions">
      <button class="m-btn" onclick="closeModal()">キャンセル</button>
      <button class="m-btn primary" onclick="saveTimeEdit()">保存</button>
    </div>
  </div>
</div>

<script>
  const KEYS = { vitD: 'data_vitD_v3', zinc: 'data_zinc_v3' };
  const NAMES = { vitD: 'ビタミンD', zinc: '亜鉛' };
  let lastAction = null;
  let toastTimer = null;
  let editContext = { type: null, index: null };

  // Today's date in header
  const now = new Date();
  document.getElementById('today-date').textContent =
    `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}（${'日月火水木金土'[now.getDay()]}）`;

  refreshDisplay('vitD');
  refreshDisplay('zinc');

  // --- Record with animation ---
  function handleRecord(btn, type) {
    createRipple(event, btn);
    btn.classList.add('success');
    recordData(type);
    setTimeout(() => btn.classList.remove('success'), 1200);
  }

  function createRipple(event, btn) {
    const circle = document.createElement("span");
    const diameter = Math.max(btn.clientWidth, btn.clientHeight);
    const radius = diameter / 2;
    const rect = btn.getBoundingClientRect();
    circle.style.width = circle.style.height = `${diameter}px`;
    circle.style.left = `${event.clientX - rect.left - radius}px`;
    circle.style.top = `${event.clientY - rect.top - radius}px`;
    circle.classList.add("ripple");
    const old = btn.getElementsByClassName("ripple")[0];
    if (old) old.remove();
    btn.appendChild(circle);
  }

  // --- Data ---
  function recordData(type) {
    try {
      const list = getList(type);
      lastAction = { type, list: [...list] };
      list.unshift(new Date().getTime());
      if (list.length > 2) list.pop();
      saveList(type, list);
      refreshDisplay(type);
      showToast();
    } catch(e) { console.error(e); }
  }

  function undo() {
    if (!lastAction) return;
    saveList(lastAction.type, lastAction.list);
    refreshDisplay(lastAction.type);
    hideToast();
    lastAction = null;
  }

  // --- Edit with time picker ---
  function openEdit(type, index) {
    editContext = { type, index };
    const list = getList(type);
    const date = new Date(list[index]);
    const hh = String(date.getHours()).padStart(2, '0');
    const mm = String(date.getMinutes()).padStart(2, '0');
    document.getElementById('time-picker').value = `${hh}:${mm}`;
    const label = index === 0 ? '最新' : '前回';
    document.getElementById('edit-label').textContent = `${NAMES[type]} - ${label}の記録`;
    document.getElementById('edit-modal').classList.add('open');
  }

  function saveTimeEdit() {
    const { type, index } = editContext;
    if (type == null) return;

    const picker = document.getElementById('time-picker');
    const [h, m] = picker.value.split(':').map(Number);
    const list = getList(type);
    if (list[index]) {
      const d = new Date(list[index]);
      d.setHours(h, m, 0, 0);
      list[index] = d.getTime();
      saveList(type, list);
      refreshDisplay(type);
    }
    closeModal();
  }

  function closeModal() {
    document.getElementById('edit-modal').classList.remove('open');
    editContext = { type: null, index: null };
  }

  // --- Helpers ---
  function showToast() {
    const t = document.getElementById('toast');
    t.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
  }
  function hideToast() { document.getElementById('toast').classList.remove('show'); }
  function getList(type) { return JSON.parse(localStorage.getItem(KEYS[type]) || '[]'); }
  function saveList(type, list) { localStorage.setItem(KEYS[type], JSON.stringify(list)); }

  // --- Display ---
  function refreshDisplay(type) {
    const el = document.getElementById('display-' + type);
    const list = getList(type);

    if (list.length === 0) {
      el.innerHTML = '<div class="empty-state">まだ記録がありません</div>';
      return;
    }

    let html = '';
    list.forEach((ts, index) => {
      const date = new Date(ts);
      const timeStr = `${date.getMonth()+1}/${date.getDate()} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
      const label = index === 0 ? '最新' : '前回';
      const opacity = index === 0 ? '1' : '0.65';

      let diffHtml = '';
      if (index === 0 && list.length > 1) {
        diffHtml = `<span class="diff">前回から ${getDiff(ts, list[1])}</span>`;
      }

      html += `
        <div class="log-item" style="opacity:${opacity}; animation-delay:${index * 0.08}s">
          <div><span class="label">${label}</span></div>
          <div style="display:flex; align-items:center; gap:6px;">
            <div class="time-col">
              <span class="time">${timeStr}</span>
              ${diffHtml}
            </div>
            <button class="edit-btn" onclick="openEdit('${type}', ${index})">✎</button>
          </div>
        </div>
      `;
    });
    el.innerHTML = html;
  }

  function getDiff(now, past) {
    const mins = Math.floor((now - past) / 60000);
    if (mins < 60) return `${mins}分`;
    return `${Math.floor(mins/60)}時間${mins%60}分`;
  }
</script>

</body>
</html>
