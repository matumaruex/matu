<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f4f4f5">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💊</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23ffffff%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-size=%2270%22>💊</text></svg>">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="サプリ管理">

<title>サプリ記録</title>
<style>
  /* --- カラー変数 --- */
  :root {
    /* 背景グラデーション用 */
    --bg-grad-1: #f3f4f6;
    --bg-grad-2: #e5e7eb;
    
    /* グラスモーフィズム設定 */
    --glass-bg: rgba(255, 255, 255, 0.65);
    --glass-border: rgba(255, 255, 255, 0.8);
    --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
    
    --text-main: #1f2937;
    --text-sub: #6b7280;
    --accent-blue: #3b82f6;
    --accent-green: #10b981;
    --ripple: rgba(255, 255, 255, 0.4);
    
    --toast-bg: rgba(0, 0, 0, 0.8);
    --toast-text: #fff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-grad-1: #111827;
      --bg-grad-2: #000000;
      
      --glass-bg: rgba(30, 30, 30, 0.65);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      
      --text-main: #f9fafb;
      --text-sub: #9ca3af;
      --accent-blue: #60a5fa;
      --accent-green: #34d399;
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 20px;
    padding-top: env(safe-area-inset-top, 30px);
    /* 背景グラデーション (グラス効果を際立たせるため) */
    background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2));
    min-height: 100vh;
    color: var(--text-main);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .container {
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: 120px;
  }

  /* --- グラスモーフィズム・カード --- */
  .card {
    background: var(--glass-bg);
    box-shadow: var(--glass-shadow);
    backdrop-filter: blur(12px); /* 磨りガラスの要 */
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 24px;
    transition: transform 0.2s;
  }

  /* --- ボタン (モーフィング & リップル) --- */
  .record-btn-wrapper {
    height: 64px; /* 高さ固定でレイアウト崩れ防止 */
    margin-bottom: 20px;
    display: flex;
    justify-content: center;
  }

  button.record-btn {
    position: relative;
    overflow: hidden; /* リップルのはみ出し防止 */
    width: 100%;
    height: 100%;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  button.record-btn:active {
    transform: scale(0.96);
  }

  /* 成功時の変形 (丸くなる) */
  button.record-btn.success {
    width: 64px; /* 正円 */
    border-radius: 50%;
    background-color: var(--accent-green) !important; /* 強制的に緑 */
  }

  /* テキストとアイコンの切り替え */
  .btn-text {
    transition: opacity 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn-icon {
    position: absolute;
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.3s;
    font-size: 28px;
  }

  button.record-btn.success .btn-text { opacity: 0; }
  button.record-btn.success .btn-icon { opacity: 1; transform: scale(1); }

  /* 色設定 */
  .btn-vitD { background: linear-gradient(135deg, #3b82f6, #2563eb); }
  .btn-zinc { background: linear-gradient(135deg, #10b981, #059669); }

  /* --- 波紋エフェクト (Ripple) --- */
  span.ripple {
    position: absolute;
    border-radius: 50%;
    transform: scale(0);
    animation: ripple 0.6s linear;
    background-color: var(--ripple);
    pointer-events: none;
  }
  @keyframes ripple {
    to { transform: scale(4); opacity: 0; }
  }

  /* --- 履歴リスト --- */
  .log-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 0;
    border-bottom: 1px solid rgba(150, 150, 150, 0.2);
    animation: slideIn 0.4s ease-out;
  }
  .log-item:last-child { border-bottom: none; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .label {
    font-size: 11px;
    font-weight: bold;
    color: var(--text-sub);
    background: rgba(150, 150, 150, 0.1);
    padding: 4px 10px;
    border-radius: 20px;
    margin-right: 8px;
  }

  .time-col {
    text-align: right;
  }
  .time {
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.5px;
  }
  .diff {
    font-size: 12px;
    color: var(--text-sub);
    margin-top: 4px;
    display: block;
  }

  /* 鉛筆編集ボタン */
  .edit-btn {
    background: none;
    border: none;
    color: var(--text-sub);
    padding: 8px;
    font-size: 16px;
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.2s;
  }
  .edit-btn:active { opacity: 1; }

  /* --- Toast & Modal --- */
  #toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translate(-50%, 150%);
    background: var(--toast-bg);
    color: var(--toast-text);
    padding: 12px 24px;
    border-radius: 50px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 100;
    font-size: 14px;
    backdrop-filter: blur(8px);
  }
  #toast.show { transform: translate(-50%, 0); }
  
  #undo-btn {
    background: rgba(255,255,255,0.2);
    border: none;
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(4px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 200;
  }
  .modal-overlay.open { display: flex; animation: fadeIn 0.2s; }
  
  .modal {
    background: var(--card-bg); /* ここは不透明でも良いが統一感のためカード変数 */
    background: rgba(255, 255, 255, 0.9); /* モーダルは見やすく少し濃いめ */
    border-radius: 24px;
    padding: 24px;
    width: 80%;
    max-width: 320px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    text-align: center;
    color: #333;
  }
  @media (prefers-color-scheme: dark) {
    .modal { background: rgba(30, 30, 30, 0.9); color: #fff; }
  }

  .modal-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 20px;
  }
  .m-btn {
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-weight: bold;
    background: rgba(150,150,150,0.1);
    color: var(--text-main);
  }
  .m-btn.primary { background: var(--accent-blue); color: white; }

</style>
</head>
<body>

<div class="container">
  
  <div class="card">
    <div class="record-btn-wrapper">
      <button type="button" class="record-btn btn-vitD" onclick="handleRecord(this, 'vitD')">
        <span class="btn-text">☀️ ビタミンD</span>
        <span class="btn-icon">✔</span>
      </button>
    </div>
    <div id="display-vitD" class="log-list"></div>
  </div>

  <div class="card">
    <div class="record-btn-wrapper">
      <button type="button" class="record-btn btn-zinc" onclick="handleRecord(this, 'zinc')">
        <span class="btn-text">🔋 亜鉛 (Zinc)</span>
        <span class="btn-icon">✔</span>
      </button>
    </div>
    <div id="display-zinc" class="log-list"></div>
  </div>

</div>

<div id="toast">
  <span>記録完了</span>
  <button id="undo-btn" onclick="undo()">取り消す</button>
</div>

<div id="edit-modal" class="modal-overlay">
  <div class="modal">
    <h3 style="margin:0 0 20px 0; font-size:18px;">時間を修正</h3>
    <div class="modal-btns" style="margin-bottom:12px;">
      <button class="m-btn" onclick="adjustTime(-60)">-1時間</button>
      <button class="m-btn" onclick="adjustTime(-10)">-10分</button>
    </div>
    <div class="modal-btns">
      <button class="m-btn" onclick="closeModal()">キャンセル</button>
      <button class="m-btn primary" onclick="closeModal()">完了</button>
    </div>
  </div>
</div>

<script>
  const KEYS = { vitD: 'data_vitD_v3', zinc: 'data_zinc_v3' };
  let lastAction = null;
  let toastTimer = null;
  let editContext = { type: null, index: null };

  // 初期表示
  refreshDisplay('vitD');
  refreshDisplay('zinc');

  // --- アニメーション付き記録処理 ---
  function handleRecord(btn, type) {
    // 1. 波紋エフェクト
    createRipple(event, btn);
    
    // 2. モーフィング (ボタン変形)
    btn.classList.add('success');
    
    // 3. データ処理
    recordData(type);
    
    // 4. ボタンを1.2秒後に元に戻す
    setTimeout(() => {
      btn.classList.remove('success');
    }, 1200);
  }

  function createRipple(event, btn) {
    const circle = document.createElement("span");
    const diameter = Math.max(btn.clientWidth, btn.clientHeight);
    const radius = diameter / 2;
    const rect = btn.getBoundingClientRect();

    circle.style.width = circle.style.height = `${diameter}px`;
    circle.style.left = `${event.clientX - rect.left - radius}px`;
    circle.style.top = `${event.clientY - rect.top - radius}px`;
    circle.classList.add("ripple");

    const ripple = btn.getElementsByClassName("ripple")[0];
    if (ripple) { ripple.remove(); }

    btn.appendChild(circle);
  }

  // --- データロジック ---
  function recordData(type) {
    try {
      const list = getList(type);
      lastAction = { type, list: [...list] }; // Undo用バックアップ
      
      list.unshift(new Date().getTime());
      if (list.length > 2) list.pop();

      saveList(type, list);
      refreshDisplay(type);
      showToast();
    } catch(e) { console.error(e); }
  }

  function undo() {
    if (!lastAction) return;
    saveList(lastAction.type, lastAction.list);
    refreshDisplay(lastAction.type);
    hideToast();
    lastAction = null;
  }

  // --- 編集機能 ---
  function openEdit(type, index) {
    editContext = { type, index };
    document.getElementById('edit-modal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('edit-modal').classList.remove('open');
    editContext = { type: null, index: null };
  }

  function adjustTime(minutes) {
    const { type, index } = editContext;
    if (!type) return;
    
    const list = getList(type);
    if (list[index]) {
      list[index] += (minutes * 60 * 1000);
      saveList(type, list);
      refreshDisplay(type);
    }
  }

  // --- 共通 ---
  function showToast() {
    const t = document.getElementById('toast');
    t.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
  }
  function hideToast() { document.getElementById('toast').classList.remove('show'); }
  function getList(type) { return JSON.parse(localStorage.getItem(KEYS[type]) || '[]'); }
  function saveList(type, list) { localStorage.setItem(KEYS[type], JSON.stringify(list)); }

  // --- 表示 ---
  function refreshDisplay(type) {
    const el = document.getElementById('display-' + type);
    const list = getList(type);
    let html = '';

    if (list.length === 0) {
      html = '<div style="text-align:center; color:var(--text-sub); padding:10px; font-size:14px;">履歴なし</div>';
    } else {
      list.forEach((ts, index) => {
        const date = new Date(ts);
        const timeStr = `${date.getMonth()+1}/${date.getDate()} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
        
        const label = index === 0 ? '最新' : '前回';
        const color = index === 0 ? 'var(--text-main)' : 'var(--text-sub)';
        const opacity = index === 0 ? '1' : '0.8';

        let diffHtml = '';
        if (index === 0 && list.length > 1) {
          diffHtml = `<span class="diff">前回から ${getDiff(ts, list[1])}</span>`;
        }

        html += `
          <div class="log-item" style="color:${color}; opacity:${opacity}">
            <div><span class="label">${label}</span></div>
            <div style="display:flex; align-items:center; gap:8px;">
              <div class="time-col">
                <span class="time">${timeStr}</span>
                ${diffHtml}
              </div>
              <button class="edit-btn" onclick="openEdit('${type}', ${index})">✎</button>
            </div>
          </div>
        `;
      });
    }
    el.innerHTML = html;
  }

  function getDiff(now, past) {
    const mins = Math.floor((now - past) / 60000);
    if (mins < 60) return `${mins}分`;
    return `${Math.floor(mins/60)}時間${mins%60}分`;
  }
</script>

</body>
</html>
